<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ArgusCode</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="container">
    <header>
      <h1>ArgusCode</h1>
      <p class="subtitle">Agentic code review — self-check or independent audit</p>
    </header>

    <form id="analyze-form">
      <label>
        <span>Repository URL</span>
        <input id="repo" type="text" placeholder="https://github.com/owner/repo" required />
      </label>
      <label>
        <span>Mode</span>
        <select id="mode">
          <option value="reviewer">Reviewer (third-party audit)</option>
          <option value="self_check">Self-Check (personal punch-list)</option>
          <option value="baseline">Baseline (single-prompt rating)</option>
        </select>
      </label>
      <button type="submit" id="submit-btn">Analyze</button>
    </form>

    <div id="result" class="hidden">
      <div class="score-bar">
        <div class="score-fill" id="score-fill"></div>
        <div class="score-text" id="score-text">0%</div>
      </div>
      <div class="mode-badge" id="mode-badge">reviewer</div>
      <div class="narrative" id="narrative"></div>
      <div class="dimensions" id="dimensions"></div>
      <div class="report" id="report"></div>
    </div>

    <div id="error" class="error hidden"></div>
    <div id="loading" class="loading hidden">Analyzing… this can take a minute.</div>
  </div>

  <script src="app.js"></script>
</body>
</html>
