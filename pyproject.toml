[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "argus-code"
version = "0.1.0"
description = "ArgusCode — agentic code review with dual-mode reporting"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "google-generativeai>=0.8",
    "gitpython>=3.1",
    "rich>=13.0",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = ["ruff>=0.4", "mypy>=1.9"]
web = ["fastapi>=0.110", "uvicorn[standard]>=0.29"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
strict = true

[tool.pytest.ini_options]
testpaths = ["eval"]
